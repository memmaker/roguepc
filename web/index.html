<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rogue PC</title>
<!--og-->
<meta name="description" content="Play Rogue PC in your browser. The Epyx IBM PC edition of Rogue, in its original colours and CP437 symbols or with tiles: 26 levels down to the Amulet of Yendor, and back up again.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="--More--">
<meta property="og:title" content="Rogue PC · --More--">
<meta property="og:description" content="Play Rogue PC in your browser. The Epyx IBM PC edition of Rogue, in its original colours and CP437 symbols or with tiles: 26 levels down to the Amulet of Yendor, and back up again.">
<meta property="og:url" content="https://ruzzoli.de/roguelikes/roguepc/">
<meta property="og:image" content="https://ruzzoli.de/roguelikes/img/roguepc.png">
<meta name="twitter:card" content="summary_large_image">
<!--/og-->
<style>
	:root { --bg: #0b0b0d; --panel: #16161a; --line: #2b2b33; --text: #d8d8de; --dim: #8a8a96; --accent: #d9b24c;
		--gut: #1d1d23; --gut-hover: #d9b24c; }
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
		font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
	#bar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--panel);
		border-bottom: 1px solid var(--line); height: 32px; white-space: nowrap; overflow: hidden; }
	#bar h1 { font-size: 14px; margin: 0 8px 0 0; color: var(--accent); letter-spacing: .04em; }
	#bar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; flex: none; }
	#bar .sp { flex: 1; }
	#bar .hint { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	#bar .hint kbd { font-size: 11px; line-height: 1.3; min-width: 0; }
	.win > .t .wm-btns select { font-size: 11px; height: 16px; padding: 0 2px; background: #22222a; color: var(--text); border: 1px solid var(--line); border-radius: 3px; }
	button, #bar select { background: #22222a; color: var(--text); border: 1px solid var(--line); border-radius: 4px;
		padding: 2px 10px; font: inherit; cursor: pointer; }
	button:hover { border-color: var(--accent); }
	button.on { background: var(--accent); color: #000; border-color: var(--accent); }
	/* the PC screen (F12): 80x25 HTML lines in the VGA font, sized by the WM (A−/A+) */
	@font-face { font-family: "RogueVGA"; src: url(../fonts/WebPlus_IBM_VGA_9x16.woff) format("woff"); }
	#t-text .body { display: flex; background: #000; }
	#t-text .scr { position: relative; flex: none; margin: auto; width: 80ch; height: 25em;
		font-family: "RogueVGA", monospace; line-height: 1; }
	#t-text pre { margin: 0; font: inherit; color: #aaaaaa; white-space: pre; }
	#t-text pre > div { height: 1em; }
	#t-text .bl { animation: bl .458s step-end infinite; }
	@keyframes bl { 50% { color: transparent; } }
	#t-cur { position: absolute; width: 1ch; height: .125em; animation: cur .23s step-end infinite; }
	@keyframes cur { 50% { opacity: 0; } }
	#t-title { position: absolute; top: 0; left: 5.5556%; width: 88.8889%; height: 100%; image-rendering: pixelated; }
	#t-cur[hidden], #t-title[hidden] { display: none; }
	#game.wm-single #t-text > .t { display: flex !important; }   /* its A−/A+ also in one-window mode */
	#game.txt #t-text > .t { display: none !important; }
	.wm-list .wm-ic.ic { width: auto; height: auto; min-width: 1.2em; display: flex; justify-content: center; }
	.wm-ic.ic > span { display: block; image-rendering: pixelated; background-repeat: no-repeat; }
	.win[hidden], .split[hidden] { display: none; }
	#game.txt .win:not(#t-text), #game.txt .wm-bar { display: none !important; }
	#status { position: fixed; left: 50%; top: 40px; transform: translateX(-50%); z-index: 5;
		background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; max-width: 90vw; }
	#status.error { border-color: #b44; color: #f99; }

	/* Tiling area: windows and gutters are positioned by roguepc.js */
	#game { position: absolute; left: 0; right: 0; top: 32px; bottom: 0; overflow: hidden; background: var(--gut); }
	.win { position: absolute; background: #000; border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
	.win > .t { flex: none; display: flex; align-items: center; font-size: 11px; height: 20px; padding: 0 2px 0 6px;
		color: var(--dim); background: var(--panel); border-bottom: 1px solid var(--line); }
	.win > .t .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.win > .t .name:hover { color: var(--text); }
	.win > .t input { width: 100%; font: inherit; color: var(--text); background: #000; border: 1px solid var(--accent);
		border-radius: 2px; padding: 0 3px; height: 16px; outline: none; }
	.win > .body { flex: 1; min-height: 0; overflow: hidden; }
	.win canvas { display: block; }
	#pop { position: absolute; z-index: 3; background: #000; border: 1px solid var(--dim); box-shadow: 0 6px 24px rgba(0,0,0,.7); }
	/* text windows: lines from the game (roguepc.js), sized by the WM's A−/A+ on the body */
	.txt { margin: 0; padding: 2px 4px; font: inherit; font-size: 1em; line-height: 1.3; color: #aaaaaa; white-space: pre; }
	.txt > div { min-height: 1.3em; }
	.txt .so { background: #aaaaaa; color: #000; }
	.txt .cur { box-shadow: inset 0 -2px currentColor; }
	#t-inv .body > div { white-space: pre; min-height: 1.45em; }
	#pop { overflow: auto; }
	#pop .txt { padding: 1ch; line-height: 1.15; }
	#pop .txt > div { min-height: 1.15em; }
	#pop[hidden] { display: none; }
	.split { position: absolute; background: var(--gut); z-index: 2; touch-action: none; }
	.split.v { cursor: col-resize; }
	.split.h { cursor: row-resize; }
	.split:hover, .split.drag { background: var(--gut-hover); }

	#overlay, #help { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex;
		align-items: center; justify-content: center; z-index: 10; }
	#overlay[hidden], #help[hidden], #status[hidden], #game[hidden] { display: none; }
	.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px 24px; max-width: 560px; }
	.card h2 { margin: 0 0 10px; font-size: 16px; color: var(--accent); }
	kbd { display: inline-block; min-width: 1.7em; padding: 0 6px; text-align: center; font: 600 12px/1.6 ui-monospace, Menlo, monospace;
		background: #22222a; border: 1px solid #3a3a46; border-bottom-width: 2px; border-radius: 4px; color: var(--text); }

	/* Help: the game guide */
	#help .panel { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
		width: min(980px, calc(100vw - 32px)); height: calc(100vh - 64px); display: flex; flex-direction: column; }
	#help .head { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
	#help .head h2 { margin: 0; font-size: 16px; color: var(--accent); flex: 1; }
	#help-body { overflow: auto; padding: 4px 24px 32px; outline: none; font-size: 14px; line-height: 1.6; }
	#help-body h2 { font-size: 19px; margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); color: var(--text); }
	#help-body h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 18px 0 8px; }
	#help-body p, #help-body ul, #help-body ol { max-width: 76ch; margin: 0 0 12px; }
	#help-body li { margin: 3px 0; }
	#help-body .toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; padding: 0; list-style: none; }
	#help-body .toc a { display: block; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); text-decoration: none; }
	#help-body .toc a:hover { border-color: var(--accent); }
	#help-body .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
	#help-body .box { background: #1c1c22; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
	#help-body .key { background: #221d10; border-color: #4a3d18; }
	#help-body dl { margin: 0; display: grid; grid-template-columns: minmax(5.5em, max-content) 1fr; gap: 6px 12px; align-items: baseline; }
	#help-body dd { margin: 0; }
	#help-body .all { columns: 3 240px; column-gap: 24px; }
	#help-body .all div { break-inside: avoid; display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
	#help-body .all kbd { flex: none; }
	#help-body details summary { cursor: pointer; color: var(--accent); margin: 8px 0; }
	#help-body code { font: 12px ui-monospace, Menlo, monospace; background: #22222a; padding: 0 4px; border-radius: 3px; }
	#help-body .or { color: var(--dim); font-size: 12px; margin: 0 3px; }
	#help-body .plus { color: var(--dim); margin: 0 2px; }
	#bar h1 a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<div id="bar">
	<h1><a href="../" title="All games">&lt;</a> <a href="../shrine/roguepc.html" title="About this game">ROGUE PC</a></h1>
	<button id="btn-help" title="Game guide, controls and saving">Help</button>
	<button id="btn-file" title="Save files and new game">File ▾</button>
	<div id="menu-file">
		<button id="btn-export" title="Download the save file">Export save</button>
		<button id="btn-import" title="Load a save file from disk">Import save</button>
		<hr>
		<button id="btn-new" title="Delete the saved game in this browser">New game</button>
	</div>
	<span class="sep"></span>
	<button id="btn-layout" title="Put the windows back where they started">Windows ▾</button>
	<button id="btn-tileset" title="Map tile set: Oryx (ClassicRogue), DawnLike, DawnLike|a (animated) or None (text)">Tiles: Oryx</button>
	<select id="sel-font" title="Font for the text windows (the map has its own in text mode)"><option value="">Font: default</option></select>
	<input type="file" id="import-file" hidden>
	<span class="sp"></span>
	<span class="hint"><kbd>x</kbd> explore · <kbd>i</kbd> inventory · <kbd>Enter</kbd> command menu · <kbd>?</kbd> command help · <kbd>F12</kbd> PC screen</span>
</div>

<div id="status">Loading Rogue PC…</div>

<div id="game" hidden>
	<div class="win" id="t-map"><div class="t"><span class="name">Map</span></div><div class="body"><canvas></canvas></div></div>
	<div class="win" id="t-msg"><div class="t"><span class="name">Messages</span></div><div class="body"><pre class="txt"></pre></div></div>
	<div class="win" id="t-stat"><div class="t"><span class="name">Status</span></div><div class="body"><pre class="txt"></pre></div></div>
	<div class="win" id="t-inv"><div class="t"><span class="name">Inventory</span></div><div class="body wm-list"></div></div>
	<div class="win" id="t-vis"><div class="t"><span class="name">Visible</span></div><div class="body wm-list" id="vis"></div></div>
	<div id="pop" hidden><pre class="txt"></pre></div>
	<div class="win" id="t-text"><div class="t"><span class="name">PC screen</span></div><div class="body"><div class="scr"><pre></pre><div id="t-cur" hidden></div><img id="t-title" src="rogue-title.png" alt="" hidden></div></div></div>
</div>

<div id="help" hidden>
	<div class="panel" role="dialog" aria-label="Rogue PC guide">
		<div class="head"><h2>Rogue PC guide</h2><button id="help-close">Close</button></div>
		<div id="help-body" tabindex="-1">Loading…</div>
	</div>
</div>

<div id="overlay" hidden>
	<div class="card">
		<h2>Rogue PC has ended</h2>
		<p id="overlay-msg">Your game has been saved.</p>
		<button id="btn-restart">Play again</button>
	</div>
</div>

<script src="../rvip-wm.js"></script>
<script src="../rvip-app.js"></script>
<script src="roguepc.js"></script>
<script src="roguepc-core.js"></script>
</body>
</html>
